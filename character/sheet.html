<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#FFF8EC;font-family:"Noto Sans Thai",sans-serif;color:#2B2B2B;width:1500px}
  h1{text-align:center;font-size:46px;margin:30px 0 4px}
  .sub{text-align:center;font-size:22px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:0 40px 40px}
  .c{background:#fff;border:4px solid #2B2B2B;border-radius:24px;box-shadow:6px 6px 0 #2B2B2B;text-align:center;padding:10px 6px 14px}
  .c svg{width:100%;height:280px}
  .c b{font-size:26px;display:block}
  .c span{font-size:18px}
  .main{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:center}
  .main svg{height:540px}
  .pal{display:flex;gap:10px;justify-content:center;margin-top:6px}
  .pal i{width:44px;height:44px;border-radius:50%;border:3px solid #2B2B2B;display:inline-block}
</style></head><body>
<h1>น้องสงสัย — แผ่นตัวละคร v4</h1>
<div class="sub">นิสัย: กวนๆ ซนๆ แต่น่าเอ็นดู · ถามแทนคนดู แต่ชอบแกล้งรู้คำตอบก่อน · แว่นกลมสายเกรียน · ผมชี้เป็น ? เปลี่ยนตามอารมณ์</div>
<div class="grid" id="g"></div>
<script></script><script src="kid.js"></script><script>const sweat=`<path d="M232 96 Q242 116 232 124 Q222 116 232 96Z" fill="#9ED8FF" stroke="${INK}" stroke-width="4"/>`;
const sparkles=`<path d="M44 70 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6Z" fill="${YEL}" stroke="${INK}" stroke-width="3"/><path d="M252 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="${YEL}" stroke="${INK}" stroke-width="3"/>`;
const qs=`<text x="230" y="70" font-size="44" font-weight="900" fill="${YEL}" stroke="${INK}" stroke-width="3" font-family="sans-serif">?</text><text x="44" y="96" font-size="30" font-weight="900" fill="${YEL}" stroke="${INK}" stroke-width="2.5" font-family="sans-serif">?</text>`;
const cards=[
  {cls:"main",t:"ท่าหลัก",d:"เด็กหัวโต แว่นกลม ผมชี้รูป ? · ฮู้ดสีส้ม",o:{brow:"smug",mo:"smirk",tilt:-3},pal:true},
  {t:"สงสัย 🤔",d:"ท่าเปิดคลิป ตั้งคำถาม",o:{eye:"up",brow:"up",mo:"o",arm:"chin",extra:qs,front:true}},
  {t:"กวนๆ 😏",d:"แว่นแวบ! \"รู้ป่าว~ ไม่บอกหรอก\"",o:{gl:"glare",eye:"smug",brow:"smug",mo:"smirk",arm:"shrug",tilt:5}},
  {t:"ตกใจ 😱",d:"ตอนเจอข้อเท็จจริงแปลกๆ",o:{gl:"askew",eye:"shock",brow:"shock",mo:"shock",ah:"zig",arm:"up",extra:sweat}},
  {t:"ปิ๊ง! เข้าใจแล้ว ✨",d:"ผมชี้กลายเป็น !",o:{eye:"spark",brow:"none",mo:"grin",ah:"!",arm:"point",extra:sparkles}},
  {t:"หัวเราะ 😆",d:"หลังแกล้งคนดูสำเร็จ",o:{eye:"laugh",brow:"none",mo:"grin",arm:"belly",tilt:-6,front:true}},
  {t:"แลบลิ้น 😜",d:"ปิดคลิปแบบซนๆ",o:{gl:"norm",eye:"wink",brow:"none",mo:"tongue",arm:"point",tilt:6}},
  {t:"มองข้ามแว่น 👀",d:"\"เธอก็สงสัยใช่มั้ยล่ะ\"",o:{gl:"down",eye:"side",brow:"none",mo:"flatlow",ah:"droop"}},
  {t:"ดันแว่น 🤓",d:"\"ตามหลักวิทยาศาสตร์แล้ว...\"",o:{gl:"norm",eye:"cool",brow:"cool",mo:"smirk",arm:"left",push:1,gdy:-5,glint:1}},
  {t:"เขินๆ 🥺",d:"ตอนโดนจับได้ว่าตอบผิด",o:{eye:"sad",brow:"worry",mo:"wobble",ah:"heart",arm:"cover",front:true}},
];
document.getElementById("g").innerHTML=cards.map(c=>`<div class="c ${c.cls||""}">${kid(c.o)}<b>${c.t}</b><span>${c.d}</span>${c.pal?`<div class="pal">${[SKIN,HAIR,HOOD,CHEEK,YEL].map(x=>`<i style="background:${x}"></i>`).join("")}</div><span>สีประจำตัว</span>`:""}</div>`).join("");
</script>
</body></html>
